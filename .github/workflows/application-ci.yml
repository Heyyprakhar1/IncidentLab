name: Application CI
on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: "latest"

      - name: Install Dependencies
        run: uv sync --locked

      - name: Run Tests
        run: uv run pytest --junitxml=test-report.xml

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: apps/api/test-report.xml

      - name: Run ruff
        run: uv run ruff check .
          
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

