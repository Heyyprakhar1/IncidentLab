name: Docker-CI
on:
  push:

jobs:
  Docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Docker Build
        run: docker build -f apps/api/Dockerfile.multistage -t incidentlab-v1.0.0 apps/api/

      - name: Image verification
        run: |
          docker images
          docker image inspect incidentlab-v1.0.0

      - name: Image tagging
        run: |
          docker image tag incidentlab-v1.0.0 ${{ vars.DOCKERHUB_USERNAME }}/incidentlab:v1.0.0
          docker images

      - name: Login  to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to DockerHub
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/incidentlab:v1.0.0


