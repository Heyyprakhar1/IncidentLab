name: Docker-CI
on:
  push:

jobs:
  Docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Docker Build
        run: docker build -f apps/api/Dockerfile.multistage -t incidentlab-v1.0.0 apps/api/

      - name: Image verification
        run: |
          docker images
          docker image inspect incidentlab-v1.0.0

      - name: Image tagging
        run: |
          docker image tag incidentlab-v1.0.0 ${{ vars.DOCKERHUB_USERNAME }}
          docker images
