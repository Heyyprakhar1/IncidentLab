# ----------------------------------------------------------------------
# IncidentLab Alembic Configuration
# ----------------------------------------------------------------------

[alembic]

# Location of migration scripts
script_location = %(here)s/migrations

# Add project root to Python path
prepend_sys_path = .

# Path separator
path_separator = os

# Database URL
#
# Intentionally left blank.
# The URL is injected dynamically from app.config.Settings
# inside migrations/env.py.
sqlalchemy.url =

# ----------------------------------------------------------------------
# Post-generation Hooks
# ----------------------------------------------------------------------

[post_write_hooks]

# Example:
#
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# ----------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S